# nginx de App1 (BusinessHub) dentro del contenedor (Coolify/Hetzner). TLS lo
# ponen Cloudflare (borde) + Traefik (Coolify), así que aquí solo escuchamos en
# 80 — a diferencia de nginx-default.conf (Oracle), que terminaba TLS con
# certbot/Let's Encrypt para businesshub.myvnc.com.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy al Cloud Function posProxy. El cliente llama a /api/pos en su mismo
    # origen y nginx reenvía a la Cloud Function (src/modules/pos-sync/services.ts
    # usa el path relativo en producción). Evade adblockers que bloquean
    # *.a.run.app. Los timeouts largos son por los rebuilds de mes del POS.
    location = /api/pos {
        proxy_pass https://posproxy-xfyucmyk7q-uc.a.run.app/;
        proxy_set_header Host posproxy-xfyucmyk7q-uc.a.run.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # index.html NUNCA se cachea — debe pedirlo siempre para ver hashes nuevos
    # del build más reciente. Sin esto, clientes con cache viejo cargan JS que
    # referencia chunks que ya no existen tras un deploy.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite los emite así): cache 1 año inmutable.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/wasm
        image/svg+xml;
}
