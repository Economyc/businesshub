<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Cloudflare tambien sirve http:// sin redirigir. En http el navegador
         bloquea la camara y Firebase rechaza el origen (CORS): forzar https. -->
    <script>
      if (location.protocol === 'http:' && /(^|\.)economyc\.cc$/.test(location.hostname)) {
        location.replace('https://' + location.host + location.pathname + location.search + location.hash)
      }
    </script>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" /></noscript>
    <title>BusinessHub Admin</title>
    <script>
      (function(){
        var t = localStorage.getItem('theme');
        if (t === 'dark') {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/admin/main.tsx"></script>
  </body>
</html>
