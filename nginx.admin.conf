# nginx de App2 dentro del contenedor (Coolify/Hetzner). TLS lo ponen
# Cloudflare (borde) + Traefik (Coolify), así que aquí solo escuchamos en 80.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy al Cloud Function posProxy (mismo que App1 en Oracle): el cliente
    # llama a /api/pos en su mismo origen y nginx reenvía a la Cloud Function.
    # Necesario para el total de descuentos POS del módulo Descuentos.
    location = /api/pos {
        proxy_pass https://posproxy-xfyucmyk7q-uc.a.run.app/;
        proxy_set_header Host posproxy-xfyucmyk7q-uc.a.run.app;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_connect_timeout 60s;
        proxy_request_buffering off;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # index.html nunca se cachea (para tomar hashes nuevos tras cada deploy).
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash: cache inmutable 1 año.
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml application/wasm image/svg+xml;
}
